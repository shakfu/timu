


[project]
name = "timu"
version = "0.2.0"
description = "A team of specialised LLM agents with role-scoped tools"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = ["agents", "llm", "multi-agent"]
# This project intentionally has no runtime dependencies.
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Typing :: Typed",
]

[project.scripts]
timu = "timu.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "twine>=7.0.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "timu"
module-root = "src"
source-include = ["tests/**", "CHANGELOG.md", "LICENSE"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real model API and is billed; runs only with TIMU_LIVE=1"]

[tool.ruff]
src = ["src", "tests"]

[tool.mypy]
strict = true
